# Example secrets file for @talon/agent-tools' {fromSecret} binding
# (see ../../../docs/architecture/yaml-tool-config.md §7).
#
# Flat mapping of secret name to string value — nothing else. Point
# TALON_SECRETS_FILE at a copy of this file (gitignored, never committed)
# and any tools.yaml entry's {fromSecret: <name>} will resolve against it.
#
# Referenced from tools.example.yaml's "tickets.create" entry would look
# like, e.g.:
#   headers:
#     Authorization: { fromSecret: SUPPORT_API_KEY, prefix: "Bearer " }

WEATHER_API_KEY: "sk-replace-with-a-real-key"
SUPPORT_API_KEY: "sk-replace-with-a-real-key"
